# docker-compose.yml

services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: agave
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api_user -d agave']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mhn-network

  mongodb:
    image: mongo:7.0
    container_name: mhn-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb_user
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mhn-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    environment:
      - DATABASE_URL=postgresql://api_user:randompassword@postgres:5432/agave
      - MONGODB_URI=mongodb://mongodb_user:mongodb_password@mongodb:27017/mhn?authSource=admin
      - NODE_ENV=production
      - PORT=3000
      - FASTIFY_LOG_LEVEL=debug
      - HOST=0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/app.js"
    restart: unless-stopped
    networks:
      - mhn-network

networks:
  mhn-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
