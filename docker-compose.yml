# docker-compose.yml
# MHN TypeScript Rewrite - Complete Stack
# Services: PostgreSQL, MongoDB, Redis, Fastify API, Next.js Frontend, Nginx Reverse Proxy

version: '3.9'

services:
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: agave
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api_user -d agave']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mhn-network

  mongodb:
    image: mongo:7.0
    container_name: mhn-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb_user
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mhn-network

  redis:
    image: redis:7.2-alpine
    container_name: mhn-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mhn-network
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    environment:
      - DATABASE_URL=postgresql://api_user:randompassword@postgres:5432/agave
      - MONGODB_URI=mongodb://mongodb_user:mongodb_password@mongodb:27017/mhn?authSource=admin
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3000
      - FASTIFY_LOG_LEVEL=debug
      - HOST=0.0.0.0
      - JWT_SECRET=your-secret-key-change-in-production
      - DEPLOY_KEY=your-deploy-key-change-in-production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/app.js"
    restart: unless-stopped
    networks:
      - mhn-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=production
    ports:
      - '3001:3000'
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mhn-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For HTTPS certificates (optional)
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - mhn-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mhn-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
